<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora simples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Calculadora simples</h1>
    <form id="calculator-form">
        <input type="number" id="num1" placeholder="Digite o primeiro número" required>
        <input type="number" id="num2" placeholder="Digite o segundo número" required>
        <select id="operation">
            <option value="add">Somar</option>
            <option value="subtract">Subtrair</option>
            <option value="multiply">Multiplicar</option>
            <option value="divide">Dividir</option>
        </select>
        <button type="submit">Calcular</button>
        <!-- Botão de limpar dentro do container/form -->
        <button type="button" class="btn-clear" onclick="limparResultado()">C</button>
    </form>
    
    <div id="result"></div>
</div>

<script src="escript.js"></script>
</body>
</html>
