<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora simples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Calculadora simples</h1>
    <form id="calculator-form">
        <input type="number" id="num1" placeholder="Digite o primeiro número" required>
        <input type="number" id="num2" placeholder="Digite o segundo número" required>
        <select id="operation">
            <option value="add">Somar</option>
            <option value="subtract">Subtrair</option>
            <option value="multiply">Multiplicar</option>
            <option value="divide">Dividir</option>
        </select>
        <button type="submit">Calcular</button>
        <!-- Botão de limpar dentro do container/form -->
        <button type="button" class="btn-clear" onclick="limparResultado()">Limpar</button>
    </form>
    
    <div id="result"></div>
</div>
<button type="submit">Calcular</button>
<button type="button" class="btn-clear" onclick="limparResultado()">Limpar</button>
<button type="button" class="btn-history" onclick="toggleHistory()">Histórico</button>

<div id="result"></div>

<!-- Container do histórico -->
<div id="history-container" style="display: none; margin-top: 15px;">
    <h3>Histórico de Cálculos:</h3>
    <ul id="history-list"></ul>
    <button type="button" class="btn-clear-history" onclick="limparHistorico()">Limpar Histórico</button>
</div>
<script src="escript.js"></script>
</body>
</html>
